<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCoin - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 id="formTitle">NexCoin</h2>
        
        <!-- Auth Section -->
        <div id="auth-section">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <p>Referral Code: <span id="refDisplay">None</span></p>
            <button id="signupBtn">Sign Up</button>
            <button id="loginBtn">Login</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" style="display: none;">
            <h2>Dashboard</h2>
            <p>Your Balance: <span id="balance">0</span> NEX</p>
            
            <button id="mineBtn" class="mine-btn">⛏️ Mine +1 NEX</button>
            
            <p>Your Referral Link:</p>
            <input type="text" id="refLink" readonly>
            <p>Total Referrals: <span id="refCount">0</span></p>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkJdxeqUbOclin_dd_9mp-J7Uvf-xFQZg",
            authDomain: "nexcoin-d8747.firebaseapp.com",
            databaseURL: "https://nexcoin-d8747-default-rtdb.firebaseio.com",
            projectId: "nexcoin-d8747",
            storageBucket: "nexcoin-d8747.firebasestorage.app",
            messagingSenderId: "326445464976",
            appId: "1:326445464976:web:095ee241d952317ac78715",
            measurementId: "G-WFJRG8LPX5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
