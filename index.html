<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCoin - Cloud Mining</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Auth Section -->
        <div id="auth-section" class="card auth-card">
            <h1 class="logo">NexCoin</h1>
            <p class="subtitle">Next Generation Cloud Mining</p>
            
            <input type="email" id="email" placeholder="Enter Email" class="input-field">
            <input type="password" id="password" placeholder="Enter Password" class="input-field">
            
            <div class="ref-box">
                Referral Code: <span id="refDisplay">None</span>
            </div>
            
            <button id="signupBtn" class="btn btn-primary">Create Account</button>
            <button id="loginBtn" class="btn btn-secondary">Login</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="dashboard-container" style="display: none;">
            <header class="dash-header">
                <h1 class="logo">NexCoin</h1>
                <button id="logoutBtn" class="btn btn-logout">Logout</button>
            </header>

            <div class="stats-grid">
                <div class="card stat-card">
                    <p class="stat-label">Available Balance</p>
                    <h2 class="stat-value"><span id="balance">0</span> NEX</h2>
                </div>
                <div class="card stat-card">
                    <p class="stat-label">Total Referrals</p>
                    <h2 class="stat-value"><span id="refCount">0</span></h2>
                </div>
            </div>

            <div class="card mining-card">
                <h3>⛏️ Active Mining</h3>
                <div class="mining-display">
                    <div class="pending-box">
                        <p>Pending NEX</p>
                        <h3><span id="pendingBalance">0.00</span></h3>
                    </div>
                    <button id="claimBtn" class="btn btn-success">Claim to Balance</button>
                </div>
                <p class="mining-info">Mining at 0.1 NEX per second. Click claim to move to main balance.</p>
            </div>

            <div class="card referral-card">
                <h3>🚀 Invite Friends</h3>
                <p>Earn 10 NEX for every friend who signs up with your link!</p>
                <input type="text" id="refLink" readonly class="input-field">
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkJdxeqUbOclin_dd_9mp-J7Uvf-xFQZg",
            authDomain: "nexcoin-d8747.firebaseapp.com",
            databaseURL: "https://nexcoin-d8747-default-rtdb.firebaseio.com",
            projectId: "nexcoin-d8747",
            storageBucket: "nexcoin-d8747.firebasestorage.app",
            messagingSenderId: "326445464976",
            appId: "1:326445464976:web:095ee241d952317ac78715",
            measurementId: "G-WFJRG8LPX5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
    </script>
    <!-- Notice the ?v=2 below. This stops the browser from using old cached code -->
    <script type="module" src="app.js?v=2"></script>
</body>
</html>
